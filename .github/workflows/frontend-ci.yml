name: Frontend CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-frontend:
    name: Detect frontend validation scope
    runs-on: ubuntu-latest
    outputs:
      run_frontend: ${{ steps.scope.outputs.run_frontend }}
    steps:
      - name: Checkout candidate history without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide independently from self-merge classification
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "invalid pull-request commit identity" >&2
            exit 2
          fi
          set +e
          git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            apps/web contracts packages/shared-contracts tools/web-e2e \
            package.json pnpm-lock.yaml pnpm-workspace.yaml .node-version
          DIFF_STATUS=$?
          set -e
          if [[ "$DIFF_STATUS" -eq 0 ]]; then
            echo "run_frontend=false" >> "$GITHUB_OUTPUT"
          elif [[ "$DIFF_STATUS" -eq 1 ]]; then
            echo "run_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "git diff failed" >&2
            exit 2
          fi

  frontend:
    name: Frozen frontend and browser gate
    needs: [detect-frontend]
    if: needs.detect-frontend.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout untrusted candidate without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Use pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - name: Activate pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.13.0 --activate
          test "$(node --version)" = "v24.12.0"
          test "$(corepack pnpm --version)" = "11.13.0"
      - name: Install locked root dependencies without lifecycle scripts
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify generated shared contract
        run: corepack pnpm --filter @sejong-ai/shared-contracts generate:check
      - name: Test shared contract
        run: corepack pnpm --filter @sejong-ai/shared-contracts test
      - name: Lint web
        run: corepack pnpm --filter @sejong-ai/web lint
      - name: Typecheck web
        run: corepack pnpm --filter @sejong-ai/web typecheck
      - name: Unit test web
        run: corepack pnpm --filter @sejong-ai/web test
      - name: Build web with fixed synthetic sentinels only
        env:
          SEJONG_WEB_SECRET_SENTINEL: synthetic-ci-bundle-sentinel-not-a-secret
          DATABASE_URL: synthetic-ci-bundle-sentinel-not-a-secret
          SUPABASE_SERVICE_ROLE_KEY: synthetic-ci-bundle-sentinel-not-a-secret
          LLM_API_KEY: synthetic-ci-bundle-sentinel-not-a-secret
          CONTEXT_TOKEN_SECRET: synthetic-ci-bundle-sentinel-not-a-secret
          DEEPSEEK_API_KEY: synthetic-ci-bundle-sentinel-not-a-secret
        run: corepack pnpm --filter @sejong-ai/web build
      - name: Scan browser bundle without server secret environment
        env:
          SEJONG_WEB_SECRET_SENTINEL: synthetic-ci-bundle-sentinel-not-a-secret
        run: node scripts/check_web_bundle_secrets.mjs apps/web/.next
      - name: Verify production dependency boundary
        run: node scripts/check_web_prod_dependency_boundary.mjs
      - name: Install locked browser-test dependencies without lifecycle scripts
        run: corepack pnpm --dir tools/web-e2e install --frozen-lockfile --ignore-scripts
      - name: Install Chromium runner dependencies
        run: corepack pnpm --dir tools/web-e2e exec playwright install --with-deps chromium
      - name: Run production-server browser tests
        run: corepack pnpm --dir tools/web-e2e test

  frontend-summary:
    name: Frontend CI summary
    needs: [detect-frontend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require detection and every reached frontend gate
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect-frontend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail
          if [[ "$DETECT_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$FRONTEND_RESULT" != "success" && "$FRONTEND_RESULT" != "skipped" ]]; then
            exit 1
          fi
          echo "frontend-ci-summary=pass"
