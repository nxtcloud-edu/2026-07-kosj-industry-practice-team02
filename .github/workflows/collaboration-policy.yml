name: Collaboration policy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-pr:
    name: Trusted policy against pull-request candidate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout untrusted candidate without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Use pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12.13
      - name: Use pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - name: Activate pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.13.0 --activate
          test "$(node --version)" = "v24.12.0"
          test "$(corepack pnpm --version)" = "11.13.0"
          test "$(python --version)" = "Python 3.12.13"
      - name: Classify author and changed paths with trusted code
        working-directory: candidate
        shell: bash
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FRONTEND_LOGIN: ${{ vars.FRONTEND_COLLABORATOR_LOGIN }}
        run: |
          set -euo pipefail
          python ../trusted/scripts/check_collaboration_scope.py \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --pr-author "$PR_AUTHOR" \
            --frontend-login "$FRONTEND_LOGIN" | tee ../scope-result.json
          CLASSIFICATION="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["classification"])' ../scope-result.json)"
          if [[ "${PR_AUTHOR,,}" == "${FRONTEND_LOGIN,,}" && "$CLASSIFICATION" != "FRONTEND_SELF_MERGE_ELIGIBLE" ]]; then
            echo "frontend collaborator changed owner-reviewed scope" >&2
            exit 1
          fi
      - name: Validate active Markdown links and tracked JSON with trusted code
        run: python trusted/scripts/check_repository_docs.py --repository-root candidate
      - name: Scan candidate files with trusted value-redacting rules
        shell: pwsh
        run: pwsh -NoProfile -File trusted/scripts/check_secret_patterns.ps1 -RepositoryRoot candidate
      - name: Install locked contract dependencies without lifecycle scripts
        working-directory: candidate
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify shared-contract generation drift
        working-directory: candidate
        run: corepack pnpm --filter @sejong-ai/shared-contracts generate:check

  policy-main:
    name: Main and manual static policy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted current main without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate current main without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Use pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12.13
      - name: Use pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - name: Activate pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.13.0 --activate
          test "$(node --version)" = "v24.12.0"
          test "$(corepack pnpm --version)" = "11.13.0"
          test "$(python --version)" = "Python 3.12.13"
      - name: Record after-the-fact main push audit reminder
        if: github.event_name == 'push'
        shell: bash
        env:
          PUSH_ACTOR: ${{ github.actor }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "::warning::Review this main update in the repository audit log; GitHub Free policy forbids direct main pushes."
          printf 'actor=%s before=%s after=%s\n' "$PUSH_ACTOR" "$PUSH_BEFORE" "$PUSH_AFTER"
      - name: Validate active Markdown links and tracked JSON with trusted code
        run: python trusted/scripts/check_repository_docs.py --repository-root candidate
      - name: Scan candidate files with trusted value-redacting rules
        shell: pwsh
        run: pwsh -NoProfile -File trusted/scripts/check_secret_patterns.ps1 -RepositoryRoot candidate
      - name: Install locked contract dependencies without lifecycle scripts
        working-directory: candidate
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify shared-contract generation drift
        working-directory: candidate
        run: corepack pnpm --filter @sejong-ai/shared-contracts generate:check

  policy-summary:
    name: Collaboration policy summary
    needs: [policy-pr, policy-main]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every reached policy job
        shell: bash
        env:
          PR_RESULT: ${{ needs.policy-pr.result }}
          MAIN_RESULT: ${{ needs.policy-main.result }}
        run: |
          set -euo pipefail
          for RESULT in "$PR_RESULT" "$MAIN_RESULT"; do
            if [[ "$RESULT" != "success" && "$RESULT" != "skipped" ]]; then
              exit 1
            fi
          done
          if [[ "$PR_RESULT" == "skipped" && "$MAIN_RESULT" == "skipped" ]]; then
            exit 1
          fi
          echo "collaboration-policy-summary=pass"
