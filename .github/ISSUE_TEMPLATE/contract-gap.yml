name: "[CONTRACT] Frontend contract gap"
description: "Frontend가 임의 타입·mock workaround를 만들지 않고 owner에게 계약 결정을 요청합니다."
title: "[CONTRACT] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        비밀, 실제 개인정보, 시민 질문 원문을 붙이지 마세요. 이 Issue는 공개 계약 간극만 설명합니다.
  - type: input
    id: task
    attributes:
      label: TASK ID
      placeholder: WEB-CHAT-001
    validations:
      required: true
  - type: textarea
    id: user_flow
    attributes:
      label: Affected user flow
      description: 어떤 화면·상태가 계약 부재로 막혔는지 설명합니다.
    validations:
      required: true
  - type: textarea
    id: expected_contract
    attributes:
      label: expected contract
      description: 필요한 request/response field, enum 또는 오류 상태를 값 예시 없이 설명합니다.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Current evidence
      description: 현재 OpenAPI/generated type과 재현 절차를 적습니다.
    validations:
      required: true
  - type: dropdown
    id: workaround
    attributes:
      label: workaround
      description: Frontend가 임시 계약이나 production mock을 추가했습니까?
      options:
        - "No — blocked pending owner contract PR"
        - "Yes — remove it before merge"
    validations:
      required: true
